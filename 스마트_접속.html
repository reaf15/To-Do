<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCUC-FMS 시설물종합관리시스템 스마트 접속</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      border: 1px solid #334155;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(20, 184, 166, 0.2);
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(20, 184, 166, 0.15);
      color: #2dd4bf;
      border: 1px solid rgba(20, 184, 166, 0.3);
      margin-bottom: 0.75rem;
    }
    h2 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    #status {
      color: #94a3b8;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
      min-height: 2.8rem;
    }
    .buttons {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.8rem;
      transition: all 0.2s;
      flex: 1;
    }
    .btn-primary {
      background: #0d9488;
      color: white;
    }
    .btn-primary:hover {
      background: #0f766e;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">스마트 자동 감지 시스템</div>
    <div class="spinner" id="loader"></div>
    <h2>시설물종합관리시스템 (NCUC-FMS)</h2>
    <div id="status">사내 메인 PC 서버 상태 확인 중...</div>

    <div id="manual-buttons" style="border-top: 1px solid #334155; padding-top: 1.25rem; margin-top: 0.5rem;">
      <p style="font-size: 0.75rem; color: #64748b; margin-bottom: 0.75rem;">원하는 서버로 바로 이동:</p>
      <div class="buttons">
        <a href="http://192.168.101.96:5173" class="btn btn-primary">🏠 내 PC (메인)</a>
        <a href="https://ncuc-fms.onrender.com/" class="btn btn-secondary">☁️ Render (클라우드)</a>
      </div>
    </div>
  </div>

  <script>
    const LOCAL_URL = 'http://192.168.101.96:5173';
    const RENDER_URL = 'https://ncuc-fms.onrender.com/';
    const statusEl = document.getElementById('status');
    const loaderEl = document.getElementById('loader');

    let redirected = false;

    // 1. Try connecting to Local PC with 1.2s timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 1200);

    fetch(LOCAL_URL + '/api/server-info', { signal: controller.signal })
      .then(res => {
        clearTimeout(timeoutId);
        if (res.ok) {
          redirected = true;
          statusEl.innerHTML = '<span style="color: #34d399; font-weight: 800;">🟢 내 PC 메인 서버 감지됨!</span><br><span style="font-size: 0.75rem; color: #94a3b8;">초고속 메인 편집 서버로 즉시 이동합니다...</span>';
          setTimeout(() => { window.location.href = LOCAL_URL; }, 400);
        } else {
          fallbackToRender();
        }
      })
      .catch(() => {
        clearTimeout(timeoutId);
        fallbackToRender();
      });

    function fallbackToRender() {
      if (redirected) return;
      redirected = true;
      statusEl.innerHTML = '<span style="color: #fbbf24; font-weight: 800;">☁️ 메인 PC 전원 꺼짐 감지됨</span><br><span style="font-size: 0.75rem; color: #94a3b8;">Render 클라우드 원격 열람 서버로 안전하게 전환합니다...</span>';
      loaderEl.style.borderTopColor = '#fbbf24';
      setTimeout(() => { window.location.href = RENDER_URL; }, 800);
    }
  </script>
</body>
</html>
